server.port=8080

# Get FREE key from https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:demo-key-for-sih}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

# H2 Database for easy demo - No MySQL setup needed
spring.datasource.url=jdbc:h2:mem:sakshamdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
