<!DOCTYPE html><html><head><title>SAKSHAM</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="/css/style.css"></head>
<body class="bg-[#0f0c29] text-white p-6">
<nav class="glass p-4 rounded-2xl flex justify-between mb-6"><h1 class="font-bold text-xl">SAKSHAM</h1><a href="/upload" class="bg-blue-600 px-6 py-2 rounded-full">AI MCQ Generator</a></nav>
<div class="grid grid-cols-3 gap-6 mb-6">
<div class="glass score-card p-6 rounded-2xl text-center"><h3>Communication</h3><div class="text-5xl font-bold text-red-400" id="commScore">--</div></div>
<div class="glass score-card p-6 rounded-2xl text-center"><h3>Technical</h3><div class="text-5xl font-bold text-green-400" id="techScore">--</div></div>
<div class="glass score-card p-6 rounded-2xl text-center"><h3>Teamwork</h3><div class="glass score-card text-5xl font-bold text-yellow-400" id="teamScore">--</div></div>
</div>
<div class="grid grid-cols-2 gap-6"><div class="glass p-6 rounded-2xl"><h2 class="font-bold mb-4">Diagnostic Test</h2><div id="quiz"></div><button onclick="submitQuiz()" class="mt-4 bg-green-600 px-6 py-2 rounded-xl w-full">Submit & Analyze Gap</button></div><div class="glass p-6 rounded-2xl"><canvas id="gapChart"></canvas><div id="result" class="mt-4 hidden glass p-4 rounded-xl"></div></div></div>
<script src="/js/dashboard.js"></script>
</body></html>
