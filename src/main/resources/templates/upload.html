<!DOCTYPE html>
<html>
<head><title>MCQ Generator</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-6">
<div class="max-w-4xl mx-auto">
<h1 class="text-3xl font-bold">AI MCQ Generator from MoSPI Documents</h1>
<p class="text-gray-600">Upload any PDF: ASI Manual, NSSO Instruction, National Accounts PDF</p>

<div class="bg-white p-6 rounded-xl shadow mt-6">
<input type="file" id="pdfFile" accept=".pdf" class="mb-4">
<button onclick="generate()" id="btn" class="bg-blue-600 text-white px-6 py-2 rounded">Generate MCQs using AI</button>
<p id="status" class="mt-3 text-gray-500"></p>
</div>
<div id="mcqs" class="mt-6"></div>
</div>
<script>
async function generate(){
 let file=document.getElementById('pdfFile').files[0];
 if(!file){ alert('Select PDF'); return; }
 document.getElementById('status').innerText='Extracting text & Calling Gemini AI... Wait 15 sec...';
 document.getElementById('btn').disabled=true;
 let form=new FormData();
 form.append('file', file);
 let res=await fetch('/api/generate', {method:'POST', body:form});
 let text=await res.text();
 document.getElementById('status').innerText='Generated!';
 try{
  let jsonStr=text;
  // Gemini returns nested JSON, parse it
  let outer=JSON.parse(text);
  let innerText=outer.candidates[0].content.parts[0].text;
  // clean ```json
  innerText=innerText.replace(/```json/g,'').replace(/```/g,'');
  let mcqs=JSON.parse(innerText);
  let html="";
  mcqs.forEach((m,i)=>{
   html+=`<div class="bg-white p-5 rounded-xl shadow mt-4"><p class="font-bold">${i+1}. ${m.question}</p>
   <p>A) ${m.optionA}</p><p>B) ${m.optionB}</p><p>C) ${m.optionC}</p><p>D) ${m.optionD}</p>
   <p class="mt-2 text-green-600 font-bold">Answer: ${m.correctAnswer}</p>
   <p class="text-sm text-gray-600">Exp: ${m.explanation}</p></div>`;
  });
  document.getElementById('mcqs').innerHTML=html;
 } catch(e){
  document.getElementById('mcqs').innerHTML=`<pre class="bg-white p-4 rounded">${text}</pre>`;
 }
 document.getElementById('btn').disabled=false;
}
</script>
</body>
</html>
