<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>SAKSHAM</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
<div class="min-h-screen flex items-center justify-center">
<div class="bg-gray-800 p-10 rounded-2xl w-full max-w-md shadow-2xl">
<h1 class="text-3xl font-bold mb-2">SAKSHAM</h1>
<p class="text-gray-400 mb-6">AI Platform for Official Statistical System + iGOT</p>
<input id="name" placeholder="Enter Name / Employee ID" class="w-full p-3 rounded bg-gray-700 mb-4">
<button onclick="startTest()" class="w-full bg-blue-600 p-3 rounded font-bold hover:bg-blue-700">Start Competency Test</button>
</div>
</div>
<script>
function startTest(){
 localStorage.setItem('user', document.getElementById('name').value);
 window.location.href='/dashboard';
}
</script>
</body>
</html>
